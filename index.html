<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Analizador de Chat - Grupo 9</title>
    <link rel="stylesheet" href="css/styles.css">
</head>
<body>
    <header>
        <h1>Analizador de Chat de WhatsApp</h1>
    </header>

    <main class="container">
        <section class="upload-area">
            <input type="file" id="chatFile" accept=".txt">
        </section>

        <div id="status">Esperando archivo...</div>

        <section id="results-area" style="margin-top: 30px;">
            <div id="user-metrics">
                <h3>Participantes Detectados</h3>
                <ul id="list-participantes"></ul>

                <h3>Ranking de Mensajes</h3>
                <table id="tabla-ranking" border="1" style="width: 100%; border-collapse: collapse;">
                    <thead>
                        <tr>
                            <th style="padding: 8px; text-align: left;">Usuario</th>
                            <th style="padding: 8px; text-align: left;">Mensajes</th>
                        </tr>
                    </thead>
                    <tbody>
                        </tbody>
                </table>
            </div>
            <!-- HORAS CON MÁS MENSAJES -->
            <div id="hour-metrics" style="margin-top: 20px;">
                <h3>Franja Horaria con Mayor Actividad</h3>
                <table id="tabla-horas" border="1" style="width: 100%; border-collapse: collapse;">
                    <thead>
                        <tr>
                            <th style="padding: 8px; text-align: left;">Hora</th>
                            <th style="padding: 8px; text-align: left;">Mensajes</th>
                        </tr>
                    </thead>
                    <tbody id="tbody-horas">
                    </tbody>
                </table>
            </div>
            <!-- DÍAS CON MÁS MENSAJES -->
            <div id="day-metrics" style="margin-top: 20px;">
                <h3>Top 5 Días con Más Mensajes</h3>
                <table id="tabla-top5-dias" border="1" style="width: 100%; border-collapse: collapse;">
                    <thead>
                        <tr>
                            <th style="padding: 8px; text-align: left;">Fecha</th>
                            <th style="padding: 8px; text-align: left;">Mensajes</th>
                        </tr>
                    </thead>
                    <tbody id="tbody-top5-dias">
                    </tbody>
                </table>
 
                <h3 style="margin-top: 20px;">Actividad por Día de la Semana</h3>
                <table id="tabla-dias-semana" border="1" style="width: 100%; border-collapse: collapse;">
                    <thead>
                        <tr>
                            <th style="padding: 8px; text-align: left;">Día</th>
                            <th style="padding: 8px; text-align: left;">Mensajes</th>
                        </tr>
                    </thead>
                    <tbody id="tbody-dias-semana">
                    </tbody>
                </table>
            </div>
        </section>
    </main>

    <script type="module" src="js/app.js"></script>
</body>
</html>
